[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-guardrail"
version = "0.1.0"
description = "A small, policy-driven safety layer for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
guardrail = "guardrail.cli:main"

[tool.setuptools.packages.find]
include = ["guardrail*"]

[tool.setuptools.package-data]
guardrail = ["policies/*.yaml", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
